name: Compass

on:
  # The schedule is switched off while the bot runs on HostAfrica (only one copy may read the messages).
  # To go back to GitHub, add it again:
  #   schedule:
  #     - cron: "2-59/5 1-18 * * *"
  workflow_dispatch:
    inputs:
      test_time:
        description: "Optional safe test: pretend it is this time (HH:MM, e.g. 05:05) on Day 1. Sends labelled test messages and changes nothing."
        required: false
        default: ""

concurrency:
  group: compass
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  compass:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
      TEST_TIME: ${{ github.event.inputs.test_time }}
    steps:
      - uses: actions/checkout@v4

      - name: Run Compass
        run: python3 bot.py

      - name: Cache voice model
        if: hashFiles('voice_text.txt') != ''
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0

      - name: Send voice note
        if: hashFiles('voice_text.txt') != ''
        run: |
          sudo apt-get install -y -q ffmpeg
          pip install -q kokoro-onnx soundfile
          python3 voice.py
